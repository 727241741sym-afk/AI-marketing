[project]
name = "atlas-research-api"
version = "0.1.0"
description = "FastAPI backend for a Traditional Chinese TradingAgents SaaS"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "psycopg[binary,pool]>=3.2.0",
  "redis>=5.2.0",
  "rq>=2.0.0",
  "stripe>=11.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
tradingagents = [
  "tradingagents @ git+https://github.com/tauricresearch/tradingagents.git",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
